name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 ScanPullRequest needs pull_requests:read and fails with
      # "Resource not accessible by integration" under default GITHUB_TOKEN on this repo.
      # CLI detect on the checked-out history avoids that API and still gates secrets.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1
